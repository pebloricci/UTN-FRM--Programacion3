<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
</head>
<body>

  <h1>Formulario de Registro</h1>

  <form action="#" method="post">
    
    <!-- 1. Nombre completo -->
    <div>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required tabindex="1">
    </div>
    <br>
    <!-- 2. Email -->
    <div> 
      <label for="email">Correo Electronico:</label>
      <input type="email" id="email" name="email" placeholder="Ej:juanperez@gmail.com" required tabindex="2">
    </div>
    <br>
    <!-- 3. Contrasena -->
    <div> 
      <label for="password">Contrasena:</label>
      <input type="password" id="password" name="password" placeholder="Minimo de 8 caracteres" required tabindex="3">
    </div>
    <br>
    <!-- 4. Seleccion de genero -->
    <div>
      <p>Seleccion de genero:</p> 
      <input type="radio" id="genero-masculino" name="genero" value="masculino" tabindex="4">
      <label for="genero-masculino">Masculino</label>

      <input type="radio" id="genero-femenino" name="genero" value="femenino" tabindex="5">
      <label for="genero-femenino">femenino</label>

      <input type="radio" id="genero-otro" name="genero" value="otro" tabindex="6">
      <label for="genero-otro">Otro</label>
    </div>
    <br>
    <!-- 5. Intereses -->
    <div>
      <p>Intereses:</p>
      <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="7">
      <label for="musica">Musica</label>

      <input type="checkbox" id="videojuegos" name="intereses" value="videojuegos" tabindex="8">
      <label for="videojuegos">Videojuegos</label>

      <input type="checkbox" id="programacion" name="intereses" value="programacion" tabindex="9">
      <label for="programacion">Programacion</label>
    </div>
    <br>
    <!-- 6. Comentarios adicionales -->
    <div>
      <p>Comentarios adicionales:</p>
      <textarea name="comentarios" id="comentarios" tabindex="10">...</textarea>
    </div>
    <br>
    <!-- 7. Pais -->
     <div>
      <label for="pais">Elige un pais:</label>
      <select name="pais" id="pais" required tabindex="11">
        <option value="">-- Selecciona un pais --</option>
        <option value="argentina">Argentina</option>
        <option value="brasil">Brasil</option>
        <option value="chile">Chile</option>
      </select>
     </div>
    <br>
    <!-- 8. Boton de envio -->
    <div>
      <input type="submit" value="Enviar" tabindex="12">
    </div>
  </form>
</body>
</html>
