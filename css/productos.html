<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo Práctico: Tarjetas de Producto</title>
  <link rel="stylesheet" href="productos.css">
</head>
<body>

  <header class="encabezado">
    <h1>Trabajo Práctico: Tarjetas de Producto</h1>
    <h2>Galería de Productos</h2>
    <p class="subtitulo">Resolución del ejercicio de maquetación con HTML y CSS</p>
  </header>

  <main class="contenedor-galeria">
    <!-- Tarjeta de Producto 1 -->
    <article class="tarjeta-producto">
      <!-- 1. Imagen simulada (cuadrado de color) -->
      <div class="imagen-simulada"></div>
      <!-- 2. Título en mayúsculas -->
      <h3 class="titulo-producto">Auriculares Pro</h3>
      <!-- 3. Descripción breve -->
      <p class="descripcion-producto">Auriculares inalámbricos con cancelación de ruido.</p>
      <!-- 4. Botón de compra con hover -->
      <button class="boton-comprar">Comprar</button>
    </article>

    <!-- Tarjeta de Producto 2 -->
    <article class="tarjeta-producto">
      <!-- 1. Imagen simulada (cuadrado de color) -->
      <div class="imagen-simulada"></div>
      <!-- 2. Título en mayúsculas -->
      <h3 class="titulo-producto">Teclado Mecánico</h3>
      <!-- 3. Descripción breve -->
      <p class="descripcion-producto">Teclado con retroiluminación RGB y switches azules.</p>
      <!-- 4. Botón de compra con hover -->
      <button class="boton-comprar">Comprar</button>
    </article>
  </main>

  <footer class="pie-pagina">
    <p>Resolución del Trabajo Práctico</p>
  </footer>

</body>
</html>
